{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
    <h2>S'inscrire</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">S'inscrire</button>
    </form>
    <p>Déjà membre ? <a href="{% url 'utilisateurs:signup' %}">Se connecter</a></p>
{% endblock %}
